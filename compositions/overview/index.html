<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,600&family=IBM+Plex+Sans:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        margin: 0; width: 1920px; height: 1080px;
        overflow: hidden; background: #0c0d10;
        font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, sans-serif;
        color: #eaeaea;
      }
      :root {
        --bg: #0c0d10;
        --accent: #5dd4e0;
        --text: #eaeaea;
        --text2: #a8a6a0;
        --muted: #b8b5ae;
      }

      #mycelium-bg {
        position: absolute; inset: 0;
        width: 100%; height: 100%;
        z-index: 0;
        opacity: 0.45;
        transform: scale(2);
        transform-origin: center center;
      }

      .scene {
        position: absolute; inset: 0; z-index: 1;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        padding: 120px 160px;
        gap: 48px;
        box-sizing: border-box;
      }

      .eyebrow {
        font-family: 'Geist Mono', 'SF Mono', Menlo, monospace;
        font-size: 22px;
        font-weight: 600;
        letter-spacing: 0.32em;
        text-transform: uppercase;
        color: var(--accent);
      }

      .lockup {
        display: flex; align-items: center; gap: 36px;
      }
      .lockup img {
        width: 200px; height: 200px;
        object-fit: contain;
      }
      .wordmark {
        font-family: 'Cormorant Garamond', Georgia, serif;
        font-style: italic; font-weight: 600;
        font-size: 220px;
        line-height: 1;
        letter-spacing: -0.01em;
        color: var(--text);
      }

      .subhead {
        font-size: 40px;
        font-weight: 400;
        line-height: 1.4;
        color: var(--text2);
        text-align: center;
        max-width: 1280px;
      }

      .tagline {
        font-family: 'Geist Mono', 'SF Mono', Menlo, monospace;
        font-size: 26px;
        font-weight: 600;
        letter-spacing: 0.24em;
        text-transform: uppercase;
        color: var(--accent);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="7"
      data-width="1920"
      data-height="1080"
    >
      <canvas id="mycelium-bg" class="clip" data-start="0" data-duration="7" data-track-index="0"></canvas>

      <div id="scene-overview" class="scene clip" data-start="0" data-duration="7" data-track-index="1">
        <div id="eyebrow" class="eyebrow">Mycelium · Hackathon</div>

        <div class="lockup">
          <img id="logo" src="logo.png" alt="" />
          <div id="wordmark" class="wordmark">mycelium</div>
        </div>

        <div id="subhead" class="subhead">
          Try the product. Tell us what works.
          Help shape what's coming next.
        </div>

        <div id="tagline" class="tagline">Shared Intent · Shared Memory · Shared Context</div>
      </div>
    </div>

    <script src="mycelium-bg.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // Eyebrow opens — sets the frame: this is the hackathon.
      tl.from("#eyebrow", { opacity: 0, y: -16, duration: 0.6, ease: "power2.out" }, 0.1);

      // Logo + wordmark — the brand lockup.
      tl.from("#logo", { opacity: 0, scale: 0.7, duration: 0.7, ease: "power3.out" }, 0.4);
      tl.from("#wordmark", { opacity: 0, x: -40, duration: 0.7, ease: "power3.out" }, 0.55);

      // Subhead — what this site is for. Drops in after the lockup settles.
      tl.from("#subhead", { opacity: 0, y: 24, duration: 0.7, ease: "power2.out" }, 1.7);

      // Tagline — closes with the brand line.
      tl.from("#tagline", { opacity: 0, y: 18, duration: 0.55, ease: "power2.out" }, 3.2);

      // No fade-out — the final frame holds everything on screen so the
      // hero video parks on a readable still after autoplay finishes.

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
